name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Tagged commits are always pushed to main/develop first, which ci.yml
  # already analyzes and tests, so this job builds only.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            build_command: flutter build macos --release
          - os: ubuntu-latest
            name: linux
            build_command: flutter build linux --release
          - os: windows-latest
            name: windows
            build_command: flutter build windows --release

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Enable desktop targets
        run: flutter config --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build app
        working-directory: app
        run: ${{ matrix.build_command }}

      - name: Package artifact
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ErrorActionPreference = "Stop"
          if ($IsWindows) {
            $src = Join-Path (Get-Location) "build/windows/x64/runner/Release"
            $dest = Join-Path (Get-Location) "dist/qwirkle-digital-windows.zip"
            Compress-Archive -Path (Join-Path $src "*") -DestinationPath $dest -Force
          } elseif ($IsMacOS) {
            $src = Join-Path (Get-Location) "build/macos/Build/Products/Release/qwirkle_digital.app"
            $dest = Join-Path (Get-Location) "dist/qwirkle-digital-macos.zip"
            # ditto (not Compress-Archive) to preserve the .app bundle's
            # symlinks and Unix permission bits, which Compress-Archive
            # doesn't reliably keep on non-Windows.
            ditto -c -k --keepParent $src $dest
          } else {
            $src = Join-Path (Get-Location) "build/linux/x64/release/bundle"
            $dest = Join-Path (Get-Location) "dist/qwirkle-digital-linux.tar.gz"
            tar -czf $dest -C $src .
          }

      - name: Generate checksums
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -NoNewline -Encoding ascii
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwirkle-digital-${{ matrix.name }}
          path: app/dist/*
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      # Signing-Key wird erst hier aus Repo-Secrets zusammengesetzt, nie im
      # Repo eingecheckt (siehe android/.gitignore und der Kommentar dazu in
      # android/app/build.gradle.kts) - ohne diese Datei würde der
      # Release-Build automatisch auf die Debug-Signatur zurückfallen.
      - name: Decode signing key
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > qwirkle-release.jks
          cat > key.properties <<PROPS
          storeFile=$(pwd)/qwirkle-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Package artifact
        working-directory: app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/qwirkle-digital-android.apk
          cd dist && sha256sum qwirkle-digital-android.apk > qwirkle-digital-android.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwirkle-digital-android
          path: app/dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: qwirkle-digital-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
