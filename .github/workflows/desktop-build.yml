name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"
      - name: Enable desktop targets
        run: flutter config --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: app
        run: flutter build macos --release
      - name: Build Linux
        if: runner.os == 'Linux'
        working-directory: app
        run: flutter build linux --release
      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: app
        run: flutter build windows --release
