name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Test and analyze
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get app dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze app
        working-directory: app
        run: flutter analyze

      - name: Test app
        working-directory: app
        run: flutter test

      - name: Test core package
        working-directory: packages/qwirkle_core
        run: dart test

      - name: Test net package
        working-directory: packages/qwirkle_net
        run: dart test
