name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Test and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"

      - name: Enable desktop targets
        run: flutter config --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get app dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze app
        working-directory: app
        run: flutter analyze

      - name: Test app
        working-directory: app
        run: flutter test

      - name: Test core package
        working-directory: packages/qwirkle_core
        run: dart test
