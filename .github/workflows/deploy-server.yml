name: Deploy Server

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

# Coolify baut und deployed qwirkle_server selbst direkt aus diesem Repo
# (docker-compose.yml am Repo-Root, siehe docs/vps_deploy_setup.md) - dieser
# Workflow stößt nur den Deploy-Webhook an, konsistent mit dem bestehenden
# Release-Rhythmus (nur v*-Tags, wie desktop-build.yml). Tagged Commits sind
# immer schon vorher auf develop/main gepusht und damit von ci.yml getestet
# worden (dort läuft auch qwirkle_servers eigene Test-Suite).
jobs:
  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/coolify_response.json -w "%{http_code}" \
            -X GET "${COOLIFY_WEBHOOK_URL}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")
          cat /tmp/coolify_response.json
          if [ "$status" -ge 300 ]; then
            echo "Coolify-Webhook antwortete mit Status $status"
            exit 1
          fi
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
